<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Set New Password — Meridian</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body { background: #1a1f2e; }</style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
  <div style="max-width:420px;width:100%" class="px-3">
    <div class="card shadow border-0">
      <div class="card-body p-4">
        <h5 class="mb-3">Set a new password</h5>
        {% if error %}
          <div class="alert alert-danger py-2 small">{{ error }}</div>
        {% endif %}
        {% if success %}
          <div class="alert alert-success">Password updated successfully. <a href="/auth/login">Sign in</a></div>
        {% else %}
        <form method="POST">
          <input type="hidden" name="token" value="{{ token }}">
          <div class="mb-3">
            <label class="form-label small fw-semibold">New Password</label>
            <input type="password" name="password" class="form-control" required minlength="6">
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Confirm Password</label>
            <input type="password" name="confirm" class="form-control" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Update Password</button>
          </div>
        </form>
        {% endif %}
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
