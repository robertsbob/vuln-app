<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Meridian Consulting Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
  <style>
    body { background: #1a1f2e; }
    .login-card { max-width: 420px; }
    .brand-logo { font-size: 1.6rem; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
    .brand-sub { color: #8a9bb5; font-size: 0.85rem; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
  <div class="login-card w-100 px-3">
    <div class="text-center mb-4">
      <div class="brand-logo"><i class="bi bi-building me-2"></i>Meridian</div>
      <div class="brand-sub">Management Consulting Portal</div>
    </div>
    <div class="card shadow border-0">
      <div class="card-body p-4">
        <h5 class="card-title mb-4">Sign in to your account</h5>
        {% if error %}
          <div class="alert alert-danger py-2 small">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/auth/login">
          <input type="hidden" name="next" value="{{ next }}">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Email address</label>
            <input type="text" name="email" class="form-control" placeholder="you@meridian.com" autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold d-flex justify-content-between">
              Password
              <a href="/auth/forgot-password" class="text-decoration-none small">Forgot password?</a>
            </label>
            <input type="password" name="password" class="form-control" placeholder="••••••••">
          </div>
          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary">Sign In</button>
          </div>
        </form>
      </div>
    </div>
    <p class="text-center text-muted small mt-3">
      Problems signing in? Contact <a href="mailto:support@meridian-consulting.com" class="text-decoration-none">IT Support</a>
    </p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
