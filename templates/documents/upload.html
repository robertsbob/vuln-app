{% extends 'base.html' %}
{% block title %}Upload Document — Meridian{% endblock %}
{% block content %}
<div class="mb-4">
  <a href="/documents" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left me-1"></i>Documents</a>
  <h4 class="mt-1 mb-0">Upload Document</h4>
</div>
<div class="row">
  <div class="col-lg-6">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <form method="POST" enctype="multipart/form-data">
          <div class="mb-3">
            <label class="form-label fw-semibold">File</label>
            <input type="file" name="file" class="form-control" required>
            <div class="form-text">Accepted formats: PDF, XLSX, DOCX, PPTX, CSV</div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Description</label>
            <input type="text" name="description" class="form-control" placeholder="e.g. Q2 Project Deliverable">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Client (optional)</label>
            <select name="client_id" class="form-select">
              <option value="">— Internal document —</option>
              {% for c in clients %}
              <option value="{{ c.id }}">{{ c.company_name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="d-flex gap-2 justify-content-end">
            <a href="/documents" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary"><i class="bi bi-upload me-1"></i>Upload</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
