{% extends 'base.html' %}
{% block title %}New Client — Meridian{% endblock %}
{% block content %}
<div class="mb-4">
  <a href="/clients" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left me-1"></i>Clients</a>
  <h4 class="mt-1 mb-0">New Client</h4>
</div>
<div class="row">
  <div class="col-lg-7">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <form method="POST">
          <div class="row">
            <div class="col-md-7 mb-3">
              <label class="form-label fw-semibold">Company Name</label>
              <input type="text" name="company_name" class="form-control" required>
            </div>
            <div class="col-md-5 mb-3">
              <label class="form-label fw-semibold">Industry</label>
              <select name="industry" class="form-select">
                <option>Technology</option><option>Financial Services</option>
                <option>Healthcare</option><option>Manufacturing</option>
                <option>Retail</option><option>SaaS</option><option>Other</option>
              </select>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Contact Name</label>
              <input type="text" name="contact_name" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Contact Email</label>
              <input type="email" name="email" class="form-control">
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Phone</label>
              <input type="text" name="phone" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Address</label>
              <input type="text" name="address" class="form-control">
            </div>
          </div>
          <div class="d-flex gap-2 justify-content-end">
            <a href="/clients" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Create Client</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
