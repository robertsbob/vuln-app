{% extends 'base.html' %}
{% block title %}New Integration — Meridian{% endblock %}
{% block content %}
<div class="mb-4">
  <a href="/integrations" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left me-1"></i>Integrations</a>
  <h4 class="mt-1 mb-0">New Webhook Integration</h4>
</div>
<div class="row">
  <div class="col-lg-6">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Integration Name</label>
            <input type="text" name="name" class="form-control" placeholder="e.g. Slack Project Notifications" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Webhook URL</label>
            <input type="url" name="webhook_url" class="form-control" placeholder="https://hooks.slack.com/…" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Trigger Event</label>
            <select name="event_type" class="form-select">
              <option value="invoice.approved">Invoice Approved</option>
              <option value="invoice.paid">Invoice Paid</option>
              <option value="project.status_change">Project Status Change</option>
              <option value="expense.approved">Expense Approved</option>
            </select>
          </div>
          <div class="d-flex gap-2 justify-content-end">
            <a href="/integrations" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Create Integration</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
